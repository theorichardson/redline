<!DOCTYPE html>
<html lang="en" style="background:#000;color-scheme:dark;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <title>Redline</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #000000;
      --card-fill: rgba(255, 255, 255, 0.09);
      --text: #ffffff;
      --text-muted: #8a8a8f;
      --text-faint: #6a6a70;
      --primary: #e63946;
      --primary-hover: #d62839;
      --success: #2a9d8f;
    }

    html,
    body {
      width: 300px;
      background: #000000;
      background-color: #000000;
      color-scheme: dark;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--text);
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .popup-frame {
      background: var(--bg);
      padding: 18px 18px 16px;
    }

    .logo {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text);
      margin-bottom: 16px;
    }

    .activate-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 13px 14px;
      background: var(--primary);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .activate-btn:hover {
      background: var(--primary-hover);
    }

    .activate-btn:focus,
    .activate-btn:focus-visible {
      outline: none;
    }

    .activate-btn.active {
      background: var(--success);
    }

    .section-title {
      font-size: 12px;
      font-weight: 400;
      color: var(--text-muted);
      padding: 0 2px;
      margin: 18px 0 8px;
    }

    .card {
      background: var(--card-fill);
      border-radius: 14px;
      overflow: hidden;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      font-size: 13px;
    }

    .row-label {
      color: var(--text);
      font-weight: 500;
    }

    .row-value {
      color: var(--text);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .row-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .row-sublabel {
      font-size: 12px;
      font-weight: 400;
      color: var(--text-muted);
      line-height: 1.35;
    }

    .row-toggle {
      cursor: pointer;
      user-select: none;
    }

    .row-toggle:focus,
    .row-toggle:focus-visible {
      outline: none;
    }

    .toggle-switch {
      position: relative;
      flex-shrink: 0;
      width: 36px;
      height: 20px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      transition: background 0.18s ease;
    }

    .toggle-switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.18s ease;
    }

    .toggle-switch.active {
      background: var(--primary);
    }

    .toggle-switch.active::after {
      transform: translateX(16px);
    }

    .hint {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
      padding: 14px 2px 0;
    }

    .link {
      color: var(--primary);
      text-decoration: none;
      cursor: pointer;
    }

    .link:hover {
      text-decoration: underline;
    }

    .unset-link {
      color: var(--primary);
      text-decoration: none;
      cursor: pointer;
      font-size: 13px;
    }

    .unset-link:hover {
      text-decoration: underline;
    }

    .footer {
      margin: 14px 2px 0;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
    }
  </style>
</head>
<body style="background:#000;margin:0;width:300px;">
  <div class="popup-frame">
    <div class="logo">Redline</div>

    <button class="activate-btn" id="activate-btn">
      <span id="activate-label">Activate</span>
    </button>

    <div class="section-title">Display</div>
    <div class="card">
      <div class="row row-toggle" id="tab-toggle-row" role="button" tabindex="0" aria-pressed="true">
        <div class="row-text">
          <span class="row-label">Show tab</span>
          <span class="row-sublabel">Quick access on all webpages</span>
        </div>
        <div class="toggle-switch" id="tab-toggle"></div>
      </div>
    </div>

    <div class="section-title">Shortcuts</div>
    <div class="card">
      <div class="row">
        <span class="row-label">Toggle inspector</span>
        <span class="row-value" id="shortcut-primary">⌥⇧R</span>
      </div>
      <div class="row">
        <span class="row-label">Toggle inspector (alt)</span>
        <span class="row-value" id="shortcut-alt">⌘⇧L</span>
      </div>
      <div class="row">
        <span class="row-label">Parent / child DIVs</span>
        <span class="row-value">↑ ↓</span>
      </div>
      <div class="row">
        <span class="row-label">Sibling DIVs</span>
        <span class="row-value">← →</span>
      </div>
      <div class="row">
        <span class="row-label">Exit Redline mode</span>
        <span class="row-value">Esc</span>
      </div>
    </div>

    <p class="hint">
      Shortcut not working? <a href="#" id="open-shortcuts" class="link">Assign it in Chrome's shortcuts page.</a>
    </p>

    <p class="footer">
      Redline doesn't track any of your data.
    </p>
  </div>

  <script src="popup.js" defer></script>
</body>
</html>
